name: Open PR Telegram Notify

on:
  pull_request:
    types:
      - reopened
      - opened

permissions: {}

jobs:
  notify_pr_open:
    name: Notify
    runs-on: ubuntu-latest
    steps:
      - name: Notify new pr on telegram group
        uses: appleboy/telegram-action@221e6b684967abe813051ee4a37dd61770a83ad3 # v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_KEY }}
          disable_web_page_preview: true
          message: |
            🔀 Nuova pull request in ${{ github.repository }}
            ${{ github.event.pull_request.title }}
            aperta da ${{ github.actor }}

            ${{ github.event.pull_request.html_url }}

            Contribuisci al gruppo open source: https://github.com/${{ github.repository }}
