name: Referral Ranking

on:
  schedule:
    - cron: "0 8 1 */3 *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ranking:
    name: Post referral ranking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: functions/.nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_MODERATION_SA }}
      - name: Send referral ranking
        working-directory: functions
        env:
          TELEGRAM_BOT_KEY: ${{ secrets.TELEGRAM_BOT_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npx tsx scripts/referral-ranking.ts
