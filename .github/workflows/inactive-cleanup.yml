name: Inactive Cleanup Detection

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  detect:
    name: Detect inactive members
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: functions/.nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm ci
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_MODERATION_SA }}
      - name: Detect inactive members
        working-directory: functions
        run: npx tsx scripts/detect-inactive.ts
      - name: Open review PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: moderation/inactive-cleanup
          title: "🧹 Pulizia inattivi: candidati al kick"
          commit-message: "chore: aggiorna candidati al kick per inattività"
          body: |
            Rilevati membri inattivi da oltre la soglia configurata in
            `functions/src/moderation/inactive.ts`.

            Il merge di questa PR esegue automaticamente il kick (rejoinabile)
            dei candidati elencati e avvisa il gruppo, tramite
            `.github/workflows/apply-kicks.yml`.

            Rivedi la lista in `moderation/pending-kicks.json` prima di
            mergiare. Chiudi la PR senza mergiare per annullare.
          labels: ""
          add-paths: moderation/pending-kicks.json
